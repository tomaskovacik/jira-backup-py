services:
  wizard:
    image: ghcr.io/tomaskovacik/jira-backup-py:latest
    profiles:
      - wizard
    volumes:
      - ./data:/backup/data
    command: ["-w"]
    stdin_open: true
    tty: true
    restart: "no"

  jira-backup:
    image: ghcr.io/tomaskovacik/jira-backup-py:latest
    profiles:
      - jira
    volumes:
      - ./data:/backup/data
    command: ["-j"]
    restart: "no"

  confluence-backup:
    image: ghcr.io/tomaskovacik/jira-backup-py:latest
    profiles:
      - confluence
    volumes:
      - ./data:/backup/data
    command: ["-c"]
    restart: "no"
